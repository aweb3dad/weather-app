<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather app</title>
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button><img src="img/211817_search_strong_icon.png" alt="" width="50px"></button>
        </div>
            <div class="weather">
                <img src="img/2995004_rain_water_drop_weather_cloud_icon.png" alt="" width="200px" class="weather-icon">
                <h1 class="temp">22℃</h1>
                <h2 class="city">New York City</h2>
                <div class="details">
                    <div class="col">
                        <img src="img/2303155_drop_essence_flow_humidity_life_icon.png" width="100px" alt="">
                        <div>
                            <p class="humidity">50%</p>
                            <p>Humidity</p>
                        </div>
                    </div>
                    <div class="col">
                        <img src="img/8725643_cloud_wind_icon.png" width="100px" alt="">
                        <div>
                            <p class="wind">15km/h</p>
                            <p>Wind Speed</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

<script>
    const apiKey = "ef4d3c8c0f026b4a2505d0578c747000";
    const apiUrl = "https://api.openweathermap.org/data/2.5/weather?&units=metric&q=";

    const searchBox = document.querySelector(".search input");
    const searchBtn = document.querySelector(".search button");
    const weatherIcon = document.querySelector ("weather-icon");
    async function checkWeather(city){
        const response = await fetch(apiUrl + city +`&appid=${apiKey}`);
        var data = await response.json();

        console.log(data);  
        document.querySelector(".city").innerHTML = data.name; 
        document.querySelector(".temp").innerHTML =Math.round(data.main.temp ) + "℃"; 
        document.querySelector(".humidity").innerHTML = data.main.humidity + "%"; 
        document.querySelector(".wind").innerHTML = data.wind.speed + "km/h"; 

        if(data.weather[0].main == "clouds" {
            weatherIcon.src = "images/"
        })
    }

    searchBtn.addEventListener("click", ()=> {
        checkWeather(searchBox.value);
    });

    checkWeather();

</script>
</body>
</html>
